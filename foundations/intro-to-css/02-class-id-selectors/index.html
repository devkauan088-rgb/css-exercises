<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p id="first">Number 1 - I'm a class!</p> <!-- red/pink bg, list of fonts.-->
    <div id="second">Number 2 - I'm one ID.</div> <!-- blue text and font size 36px-->
    <p id="third">Number 3 - I'm a class, but cooler!</p> <!-- 24x px plus odd element-->
    <div id="fourth">Number 4 - I'm another ID.</div> <!-- light green bg, font size 24px, bold-->
    <p>Number 5 - I'm a class!</p>
  </body>
</html>
